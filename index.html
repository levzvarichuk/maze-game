<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабиринт с загадками</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        color: #eaeaea;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game-root {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      canvas {
        background: #0f0f1a;
        border: 2px solid #444;
        image-rendering: pixelated;
      }
      #sidebar {
        min-width: 200px;
        padding: 16px;
        background: #22223b;
        border-radius: 8px;
      }
      h1 { margin: 0 0 12px; font-size: 18px; }
      p  { margin: 4px 0; font-size: 14px; opacity: 0.9; }
      kbd {
        background: #444; padding: 2px 6px;
        border-radius: 4px; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game" width="600" height="600"></canvas>
      <aside id="sidebar">
        <h1>Лабиринт</h1>
        <p>Управление: <kbd>← ↑ → ↓</kbd></p>
        <p>Говорить: <kbd>Enter</kbd></p>
        <p id="status">Загрузка...</p>
      </aside>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
