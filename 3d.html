<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабиринт с загадками — 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23f7d774'/%3E%3Ccircle cx='13' cy='13' r='2.5' fill='%23fff3b0'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0a0a14;
        --panel: #22223b;
        --border: #3a3a5c;
        --text: #eaeaea;
        --muted: #8888aa;
        --accent: #7ed6a5;
        --wrong: #b04a4a;
        --correct: #4a9a6a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game-root {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        padding: 24px;
        max-width: 100vw;
      }
      #scene {
        width: 720px;
        height: 540px;
        max-width: 100%;
        background: #000;
        border: 2px solid #444;
        display: block;
        aspect-ratio: 4 / 3;
        touch-action: none;
      }
      #sidebar {
        min-width: 220px;
        padding: 16px;
        background: var(--panel);
        border-radius: 8px;
      }
      h1 { margin: 0 0 12px; font-size: 18px; }
      p  { margin: 6px 0; font-size: 14px; opacity: 0.9; }
      kbd {
        background: #444; padding: 2px 6px;
        border-radius: 4px; font-size: 12px;
      }
      .hint {
        min-height: 20px;
        color: var(--accent);
        font-size: 13px;
        font-style: italic;
      }
      #mute-btn {
        margin-top: 12px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      #mute-btn:hover { color: var(--text); border-color: var(--accent); }
      #minimap {
        display: block;
        margin-top: 14px;
        background: #0f0f1a;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      #scene-wrap {
        position: relative;
        display: inline-block;
      }
      #crosshair {
        position: absolute;
        left: 50%; top: 50%;
        width: 4px; height: 4px;
        margin: -2px 0 0 -2px;
        background: rgba(255,220,180,0.85);
        border-radius: 50%;
        box-shadow: 0 0 4px rgba(0,0,0,0.6);
        pointer-events: none;
      }
      #fps-hint {
        position: absolute;
        left: 50%; bottom: 12px;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.55);
        color: #d0d0e0;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 12px;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.4s;
      }
      #fps-hint.hidden { opacity: 0; }

      /* Touch-контролы: D-pad + кнопка Enter. Скрыты на десктопе. */
      #touch-controls {
        display: none;
        position: fixed;
        bottom: 16px; left: 0; right: 0;
        z-index: 200;
        pointer-events: none;
        justify-content: space-between;
        padding: 0 16px;
        touch-action: none;
      }
      #touch-controls .side { pointer-events: auto; }
      .dpad {
        display: grid;
        grid-template-columns: 56px 56px 56px;
        grid-template-rows: 56px 56px 56px;
        gap: 4px;
      }
      .dpad button {
        background: rgba(20,20,35,0.6);
        border: 1px solid rgba(140,140,170,0.5);
        color: #d0d0e0;
        border-radius: 10px;
        font-size: 22px;
        font-family: inherit;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .dpad button:active { background: rgba(126,214,165,0.35); }
      .dpad .up    { grid-column: 2; grid-row: 1; }
      .dpad .left  { grid-column: 1; grid-row: 2; }
      .dpad .right { grid-column: 3; grid-row: 2; }
      .dpad .down  { grid-column: 2; grid-row: 3; }
      #btn-interact {
        background: rgba(126,214,165,0.7);
        color: #14142a;
        border: none;
        border-radius: 50%;
        width: 84px; height: 84px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        align-self: flex-end;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #btn-interact:active { background: rgba(160,229,194,0.9); }

      /* JS-детект touch-устройств (надёжнее чем media query — Vivo/MIUI
         иногда рапортуют pointer:fine несмотря на реальный тач) */
      html.touch #touch-controls { display: flex; }
      html.touch #fps-hint { display: none; }
      html.touch #crosshair { display: none; }
      html.touch #game-root {
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        align-items: stretch;
      }
      html.touch #scene-wrap { display: block; width: 100%; }
      html.touch #scene { width: 100%; height: auto; aspect-ratio: 4 / 3; }
      html.touch #sidebar { min-width: 0; width: 100%; padding: 10px; }
      html.touch #minimap { margin: 8px auto 0; width: 140px; height: 140px; }
      html.touchh1 { font-size: 16px; }
      html.touchp { font-size: 13px; margin: 4px 0; }

      /* Планшет / небольшие экраны */
      @media (max-width: 900px) {
        #game-root {
          flex-direction: column;
          gap: 12px;
          padding: 12px;
          align-items: stretch;
        }
        #scene-wrap { display: block; width: 100%; }
        #scene { width: 100%; height: auto; }
        #sidebar { min-width: 0; width: 100%; }
        #minimap { margin: 12px auto 0; }
      }

      /* Телефон */
      /* Fullscreen: canvas растягивается, sidebar остаётся справа */
      :fullscreen #game-root, :-webkit-full-screen #game-root {
        width: 100vw;
        height: 100vh;
        padding: 12px;
        gap: 12px;
        max-width: 100vw;
        max-height: 100vh;
        box-sizing: border-box;
        align-items: stretch;
      }
      :fullscreen #scene-wrap, :-webkit-full-screen #scene-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      :fullscreen #scene, :-webkit-full-screen #scene {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }
      :fullscreen #sidebar, :-webkit-full-screen #sidebar {
        width: 260px;
        flex-shrink: 0;
        overflow-y: auto;
      }
      #fullscreen-btn {
        margin-top: 8px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
        width: 100%;
      }
      #fullscreen-btn:hover { color: var(--text); border-color: var(--accent); }

      @media (max-width: 600px) {
        body { font-size: 14px; }
        #sidebar { padding: 10px; }
        h1 { font-size: 16px; }
        p { font-size: 13px; margin: 4px 0; }
        #minimap { width: 140px; height: 140px; }
        #game-root { padding: 8px; }
      }
      #view-toggle {
        display: block;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
        text-decoration: none;
      }
      #view-toggle:hover { color: var(--accent); }

      /* Диалог + Win (те же классы что в 2D-версии) */
      #dialog-overlay, #win-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.75);
        display: none;
        align-items: center; justify-content: center;
        z-index: 100;
      }
      #dialog-overlay.open, #win-overlay.open { display: flex; }
      #dialog-box, #win-box {
        max-width: 520px; width: 90%;
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      }
      #dialog-name {
        margin: 0 0 10px; font-size: 20px;
        color: var(--accent); letter-spacing: 0.5px;
      }
      #dialog-question {
        margin: 0 0 20px; font-size: 16px; line-height: 1.5;
        color: var(--text); font-style: italic;
      }
      #dialog-options { display: flex; flex-direction: column; gap: 10px; }
      .dialog-option {
        background: #2a2a4a;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        font-family: inherit;
      }
      .dialog-option:hover:not(:disabled) {
        background: #34345a; border-color: var(--accent);
      }
      .dialog-option:disabled { opacity: 0.5; cursor: not-allowed; }
      .dialog-option.correct {
        background: var(--correct); border-color: var(--accent);
      }
      .dialog-option.wrong {
        background: #4a2a2a; border-color: var(--wrong);
      }
      #dialog-feedback {
        margin-top: 14px; min-height: 20px;
        font-size: 14px; font-weight: 500;
      }
      #dialog-feedback.correct { color: var(--accent); }
      #dialog-feedback.wrong { color: #e88; }
      #win-box { text-align: center; max-width: 440px; }
      #win-box h1 { font-size: 32px; margin: 0 0 12px; }
      #win-box p { font-size: 15px; margin-bottom: 20px; }
      #win-restart {
        background: var(--accent); color: #1a1a2e;
        border: none; padding: 12px 24px; border-radius: 8px;
        font-size: 15px; font-weight: 600; cursor: pointer;
        font-family: inherit;
      }
      #win-restart:hover { background: #a0e5c2; }
      @keyframes pop {
        from { transform: scale(0.9); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      #dialog-overlay.open #dialog-box,
      #win-overlay.open #win-box {
        animation: pop 0.18s ease-out;
      }
    </style>
    <script>
      // Раннее touch-детект: добавляем класс до отрисовки
      (function () {
        const isTouch = 'ontouchstart' in window
          || (navigator.maxTouchPoints || 0) > 0
          || (navigator.msMaxTouchPoints || 0) > 0;
        if (isTouch) {
          document.documentElement.classList.add('touch');
          document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('touch');
          });
        }
      })();
    </script>
    <script>
      // Диагностика: если Three.js или модули не грузятся — покажем ошибку на экране,
      // а не чёрный canvas. Спасает на старых браузерах / Vivo Browser / offline.
      window.__mazeStarted = false;
      const showError = (msg) => {
        let box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'boot-error';
          box.style.cssText = 'position:fixed;inset:0;background:#0a0a14;color:#eaeaea;font-family:system-ui,sans-serif;padding:24px;overflow:auto;z-index:9999;';
          document.body?.appendChild(box);
        }
        box.innerHTML = `
          <h2 style="color:#e88;margin:0 0 12px;">Не удалось загрузить 3D-версию</h2>
          <p style="line-height:1.5;color:#d0d0e0;">${msg}</p>
          <p style="line-height:1.5;color:#d0d0e0;margin-top:16px;">Что попробовать:</p>
          <ul style="line-height:1.7;color:#d0d0e0;">
            <li>Открыть в <b>Chrome</b> (не в стандартном браузере Vivo/MIUI/Samsung)</li>
            <li>Отключить блокировщики рекламы</li>
            <li>Проверить интернет — 3D грузит Three.js с CDN</li>
          </ul>
          <p style="margin-top:20px;"><a href="./2d.html" style="color:#7ed6a5;font-size:16px;">→ Попробовать 2D-версию</a></p>
        `;
      };
      window.addEventListener('error', (e) => {
        showError('Ошибка: ' + (e.message || e.error?.message || 'unknown') + (e.filename ? ' в ' + e.filename : ''));
      });
      window.addEventListener('unhandledrejection', (e) => {
        showError('Отклонённый Promise: ' + (e.reason?.message || e.reason || 'unknown'));
      });
      // Таймаут: если main() не начался за 12 сек — вероятно упал импорт
      setTimeout(() => {
        if (!window.__mazeStarted) {
          showError('Загрузка длится дольше 12 секунд. Скорее всего Three.js не смог загрузиться из CDN (проверь интернет) или браузер не поддерживает importmap (нужен Chrome 89+ / Safari 16.4+).');
        }
      }, 12000);
    </script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <div id="game-root">
      <div id="scene-wrap">
        <canvas id="scene" width="720" height="540"></canvas>
        <div id="crosshair"></div>
        <div id="fps-hint">Клик по сцене — FPS-режим (мышь + WASD). Esc — выйти.</div>
      </div>
      <aside id="sidebar">
        <h1 id="level-title">Лабиринт 3D</h1>
        <p>Шаг: <kbd>↑</kbd> <kbd>↓</kbd></p>
        <p>Поворот: <kbd>←</kbd> <kbd>→</kbd></p>
        <p>FPS: <kbd>клик</kbd> + <kbd>WASD</kbd> + <kbd>мышь</kbd> <span style="color:var(--muted);font-size:11px;">(бег — Shift)</span></p>
        <p>Говорить: <kbd>Enter</kbd></p>
        <p>Загадок решено: <span id="solved-count">0/0</span></p>
        <p id="status">Загрузка...</p>
        <p id="hint" class="hint"></p>
        <button id="mute-btn" type="button">🔊 Звук</button>
        <button id="fullscreen-btn" type="button">⛶ На весь экран</button>
        <canvas id="minimap" width="180" height="180"></canvas>
        <a id="view-toggle" href="./2d.html">← вернуться в 2D-версию</a>
      </aside>
    </div>

    <div id="dialog-overlay">
      <div id="dialog-box">
        <h2 id="dialog-name"></h2>
        <p id="dialog-question"></p>
        <div id="dialog-options"></div>
        <div id="dialog-feedback"></div>
      </div>
    </div>

    <div id="win-overlay">
      <div id="win-box">
        <h1>🏆 Клад твой!</h1>
        <p>Ты прошёл 3D-подземелье и разгадал все загадки древних стражей.</p>
        <button id="win-restart">Играть снова</button>
      </div>
    </div>

    <div id="touch-controls">
      <div class="side">
        <div class="dpad">
          <button class="up" data-key="ArrowUp" aria-label="Вперёд">↑</button>
          <button class="left" data-key="ArrowLeft" aria-label="Влево">←</button>
          <button class="right" data-key="ArrowRight" aria-label="Вправо">→</button>
          <button class="down" data-key="ArrowDown" aria-label="Назад">↓</button>
        </div>
      </div>
      <div class="side">
        <button id="btn-interact" data-key="Enter" aria-label="Взаимодействовать">Enter</button>
      </div>
    </div>

    <script>
      // Мобильные touch-контролы: непрерывное движение пока кнопка нажата.
      // Стрелки → WASD в touchMode игры (main3d.js предоставляет window.mazeInput).
      const KEY_TO_MAZE = {
        'ArrowUp': 'w', 'ArrowDown': 's', 'ArrowLeft': 'a', 'ArrowRight': 'd',
      };
      const bindTouchButton = (btn, mazeKey) => {
        const start = (e) => {
          e.preventDefault();
          window.mazeInput?.press(mazeKey);
        };
        const end = (e) => {
          e.preventDefault();
          window.mazeInput?.release(mazeKey);
        };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('touchcancel', end, { passive: false });
        // Fallback для мыши (desktop testing)
        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointerleave', end);
      };
      document.querySelectorAll('#touch-controls .dpad button[data-key]').forEach((btn) => {
        const mazeKey = KEY_TO_MAZE[btn.dataset.key];
        if (mazeKey) bindTouchButton(btn, mazeKey);
      });
      // Enter — одиночное нажатие
      const interactBtn = document.getElementById('btn-interact');
      const fireInteract = (e) => {
        e.preventDefault();
        window.mazeInput?.interact();
      };
      interactBtn?.addEventListener('touchstart', fireInteract, { passive: false });
      interactBtn?.addEventListener('click', fireInteract);
    </script>

    <script>
      // Cache-buster: браузер держит ES-modules в памяти между reload'ами.
      // Добавляем ?v=<ts> — модуль имеет новый URL, всегда свежий.
      const s = document.createElement('script');
      s.type = 'module';
      s.src = './src/main3d.js?v=' + Date.now();
      document.body.appendChild(s);
    </script>
  </body>
</html>
